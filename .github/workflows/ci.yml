name: CI Matrix

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test & Eval (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          pytest -v

      - name: Run deterministic regex evaluation trial
        run: |
          python -m xproto.eval --suite native --planner regex --trials 1

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            results/summary_regex.json
            results/summary_regex.md
